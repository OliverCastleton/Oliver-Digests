<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Write in Obsidian, commit with rev:, push; GitHub builds and publishes the site.">
  <rect width="640" height="200" rx="10" fill="#e7e9e2"/>
  <g font-family="Georgia, serif" fill="#1a2230" text-anchor="middle">
    <rect x="24" y="56" width="160" height="88" rx="8" fill="#f3f4ef" stroke="#c9cec5"/>
    <text x="104" y="96" font-size="19">Write</text>
    <text x="104" y="120" font-size="13" font-style="italic" fill="#5d6573">in Obsidian</text>

    <rect x="240" y="56" width="160" height="88" rx="8" fill="#f3f4ef" stroke="#c9cec5"/>
    <text x="320" y="96" font-size="19">Commit</text>
    <text x="320" y="120" font-size="13" font-style="italic" fill="#5d6573">“rev: …” for a version</text>

    <rect x="456" y="56" width="160" height="88" rx="8" fill="#f6e27a" stroke="#d9c35a"/>
    <text x="536" y="96" font-size="19">Published</text>
    <text x="536" y="120" font-size="13" font-style="italic" fill="#5d6573">after you push</text>
  </g>
  <g stroke="#2743a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M192 100h38M222 92l8 8-8 8"/>
    <path d="M408 100h38M438 92l8 8-8 8"/>
  </g>
</svg>
