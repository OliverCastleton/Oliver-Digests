# Site settings: the one place to change the site's name, owner, and address.

title: Oliver Digests
author: Oliver                    # shown in the footer and page metadata
email: you@example.com            # TODO: your real address; receives "Email me about this"
description: Essays by Oliver.    # shown on the home page and in search results

# Full address of the site, with no trailing slash. It sets the base path of every link.
#   GitHub Pages project site:  https://<username>.github.io/<repo>
#   Custom domain:              https://example.com
base_url: https://oliverdigests.com

# Subject line of "Email me about this". {title} and {version} are filled in.
email_subject: "Re: {title} (v{version})"

# The Library: every published note in this vault folder is a book.
books_folder: books
# Subject line of "Email me about this book". {title} and {author} are filled in.
book_email_subject: "Re: your notes on {title}"

# The note (at the top of the vault) used as the homepage intro.
home_note: Home

# Languages in the Translate menu: language code, then its name in that language.
translate_languages:
  it: Italiano
  es: Español
  fr: Français
  de: Deutsch
  pt: Português
  nl: Nederlands
  ja: 日本語
  zh: 中文

# Medium mirror (medium_sync.py and the "Sync to Medium" workflow; see README).
medium:
  status: public                # public: publish on Medium; draft: leave them as drafts for you
  essays: true
  books: true                   # only books with notes (the ones with a page on the site)
  book_title: "Notes on {title}"  # Medium title of a book note; {title} and {author} are filled in
  max_per_run: 10               # stories created or updated per run; the rest wait for the next

# Vault folders that are never published (note templates live here).
exclude_folders: [templates]

language: en
vault: Oliver Digests Vault   # the Obsidian vault folder, relative to this file
output: _site     # the build output folder (deleted and rebuilt on each build)
