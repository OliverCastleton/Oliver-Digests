{% extends "base.html" %}
{% block title %}Tags · {{ site.title }}{% endblock %}
{% block main %}
<header class="essay-header"><h1>Tags</h1></header>
{% if tags %}
<ul class="tag-list">
{% for tag, essays in tags %}
  <li><a href="{{ base }}/tags/{{ tag|tag_slug }}/">#{{ tag }}</a> <span class="muted">({{ essays|length }})</span></li>
{% endfor %}
</ul>
{% else %}
<p class="muted">No tags yet.</p>
{% endif %}
{% endblock %}
