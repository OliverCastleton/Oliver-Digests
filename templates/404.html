{% extends "base.html" %}
{% block title %}Page not found · {{ site.title }}{% endblock %}
{% block main %}
<div class="sheet">
  <header class="column page-header">
    <h1>This page isn’t here</h1>
    <p class="dek">It may have moved, or the link has a typo.</p>
  </header>
  <div class="column">
    <p><a href="{{ base }}/">Go to the homepage</a> or <a class="search-open" href="{{ base }}/search/">search the site</a>.</p>
  </div>
</div>
{% endblock %}
